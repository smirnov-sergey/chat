openapi: 3.1.0

info:
  title: Chat API
  description: HTTP API проекта Chat. Пока доступна только проверка работоспособности.
  version: 0.1.0

servers:
  - url: http://127.0.0.1:8080
    description: Local development server

paths:
  /health:
    get:
      summary: Проверка работоспособности HTTP-сервера
      description: Не проверяет базу данных или внешние зависимости.
      operationId: getHealth
      responses:
        '200':
          description: HTTP-сервер отвечает на запросы.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok


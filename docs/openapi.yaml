openapi: 3.1.0

info:
  title: Chat API
  description: HTTP API проекта Chat. Доступны проверка работоспособности, регистрация, вход, выход, профиль и его фото, прямые, личные и групповые переписки, сообщения и история.
  version: 0.1.0

servers:
  - url: http://127.0.0.1:8080
    description: Local development server

paths:
  /health:
    get:
      summary: Проверка работоспособности HTTP-сервера
      description: Не проверяет базу данных или внешние зависимости.
      operationId: getHealth
      responses:
        '200':
          description: HTTP-сервер отвечает на запросы.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok

  /auth/register:
    post:
      summary: Регистрация пользователя
      description: |
        Создаёт пользователя и первую сессию одной транзакцией.
        При успехе автоматически выполняется вход: cookie chat_session
        действует 7 дней без продления по активности. Токен не возвращается в JSON.

        Для одного IP допускается 5 запросов регистрации за 60 секунд с первого
        запроса. Учитываются успешные и неуспешные попытки; счётчик входа отдельный.
        При ограничении возвращается 429 с Retry-After в секундах.

        Запросы браузера с чужого сайта отклоняются. Для браузерного клиента
        UI и API должны иметь один origin; CORS сейчас не настроен.
        Запросы CLI без заголовков Origin и Sec-Fetch-Site допускаются.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        description: Один JSON-объект, не более 4096 байт. Неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
            example:
              username: ' Ivan '
              name: ' Иван Петров '
              password: correct horse battery staple
      responses:
        '201':
          description: Пользователь и первая сессия созданы.
          headers:
            Set-Cookie:
              description: |
                chat_session с атрибутами Path=/, HttpOnly, SameSite=Lax и Expires.
                Срок действия — 7 дней. Secure включён по умолчанию и управляется
                SESSION_COOKIE_SECURE; для локального HTTP используется false.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Некорректный JSON, неизвестные поля или недопустимые значения полей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid request body
        '403':
          description: Запрос с чужого сайта отклонён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: cross-origin request blocked
        '409':
          description: Нормализованный username уже занят. Новая сессия не создаётся.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: username already taken
        '413':
          description: Тело запроса превышает 4096 байт.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: request body too large
        '415':
          description: Отсутствует или некорректен Content-Type application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Content-Type must be application/json
        '429':
          $ref: '#/components/responses/AuthRateLimitExceeded'
        '500':
          description: Внутренняя ошибка. Технические подробности клиенту не возвращаются.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error

  /auth/login:
    post:
      summary: Вход пользователя
      description: |
        Проверяет username и пароль, создаёт новую сессию и возвращает профиль.
        Cookie chat_session действует 7 дней без продления по активности.
        Ранее выданные сессии остаются действующими. Токен не возвращается в JSON.
        Время создания и обновления пользователя при входе не изменяется.

        Неверный username, неправильный пароль или отсутствие пароля у старого
        профиля дают один ответ 401: invalid username or password.

        Для одного IP допускается 10 запросов входа за 60 секунд с первого
        запроса. Учитываются успешные и неуспешные попытки; счётчик регистрации отдельный.
        При ограничении возвращается 429 с Retry-After в секундах.

        Запросы браузера с чужого сайта отклоняются. Для браузерного клиента
        UI и API должны иметь один origin; CORS сейчас не настроен.
        Запросы CLI без заголовков Origin и Sec-Fetch-Site допускаются.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        description: Один JSON-объект, не более 4096 байт. Неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
            example:
              username: ' Ivan '
              password: correct horse battery staple
      responses:
        '200':
          description: Пользователь вошёл; создана новая сессия.
          headers:
            Set-Cookie:
              description: |
                chat_session с атрибутами Path=/, HttpOnly, SameSite=Lax и Expires.
                Срок действия — 7 дней. Secure включён по умолчанию и управляется
                SESSION_COOKIE_SECURE; для локального HTTP используется false.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Некорректный JSON, неизвестные поля или неверные типы полей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid request body
        '401':
          description: Неверный username или пароль. Новая сессия не создаётся; Set-Cookie отсутствует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid username or password
        '403':
          description: Запрос с чужого сайта отклонён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: cross-origin request blocked
        '413':
          description: Тело запроса превышает 4096 байт.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: request body too large
        '415':
          description: Отсутствует или некорректен Content-Type application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Content-Type must be application/json
        '429':
          $ref: '#/components/responses/AuthRateLimitExceeded'
        '500':
          description: Внутренняя ошибка. Технические подробности клиенту не возвращаются.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error

  /auth/logout:
    post:
      summary: Выход пользователя
      description: |
        Удаляет сессию, определённую cookie chat_session, и очищает эту cookie.
        Остальные сессии пользователя сохраняются. Тело запроса не требуется.

        Повторный выход, отсутствие cookie, некорректный токен, истёкшая или уже
        удалённая сессия также дают 204 с очисткой cookie. Предварительная проверка
        действующей сессии не требуется. Тело ответа отсутствует.

        Запросы браузера с чужого сайта отклоняются до удаления сессии.
        Для браузерного клиента UI и API должны иметь один origin;
        CORS сейчас не настроен. Запросы CLI без заголовков Origin
        и Sec-Fetch-Site допускаются.
      operationId: logoutUser
      security:
        - sessionCookie: []
        - {}
      responses:
        '204':
          description: Выход завершён; cookie сессии удаляется. Тело ответа отсутствует.
          headers:
            Set-Cookie:
              description: |
                Очищает chat_session: пустое значение, Path=/, Max-Age=0
                и Expires в прошлом. Атрибуты HttpOnly и SameSite=Lax сохраняются.
                Secure управляется SESSION_COOKIE_SECURE, как при входе.
              schema:
                type: string
              example: 'chat_session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT; Max-Age=0; HttpOnly; SameSite=Lax'
            Cache-Control:
              schema:
                type: string
                const: no-store
        '403':
          description: Запрос с чужого сайта отклонён. Сессия не удаляется.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: cross-origin request blocked
        '500':
          description: |
            Внутренняя ошибка. Если удаление сессии не удалось, cookie не очищается.
            Технические подробности клиенту не возвращаются.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error

  /users/{id}:
    get:
      summary: Получение пользователя по ID
      description: |
        Требует действующую сессию в cookie chat_session, полученную при
        регистрации или входе. Пока разрешено читать только собственный профиль:
        ID из URL должен совпадать с ID пользователя проверенной сессии.
        Запрос чужого ID отклоняется без чтения чужой записи.

        Чтение не изменяет профиль, не продлевает сессию и не выдаёт новую cookie.
        Пароль, его хеш и токен сессии в JSON не возвращаются.
        Сессия проверяется до разбора ID: без действующей сессии возвращается 401.
      operationId: getUserByID
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Положительный ID пользователя; доступен только собственный профиль.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 42
      responses:
        '200':
          description: Профиль пользователя из действующей сессии.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: ID не является положительным целым числом в диапазоне int64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid user ID
        '401':
          description: Cookie отсутствует, токен некорректен либо сессия истекла или отозвана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid or expired session
        '403':
          description: ID из URL не совпадает с ID пользователя сессии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: access denied
        '404':
          description: Запись пользователя с собственным ID не найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: user not found
        '500':
          description: Внутренняя ошибка. Технические подробности клиенту не возвращаются.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error

  /users/{id}/photo:
    get:
      summary: Получение фото профиля
      description: |
        Возвращает текущее фото указанного пользователя. Требует действующую
        сессию в cookie chat_session; разрешено читать своё и чужое фото.
        Сессия проверяется до разбора ID: без действующей сессии возвращается 401.

        Ответ содержит байты PNG размером 256 × 256, а не JSON или ссылку на файл.
        Исходный JPEG или PNG, загруженный пользователем, не возвращается.
        Если фото не установлено или его файл отсутствует, возвращается 404.
        Чтение не изменяет профиль, не продлевает сессию и не выдаёт новую cookie.
      operationId: getUserPhoto
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Положительный ID пользователя, чьё фото запрашивается.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 42
      responses:
        '200':
          description: Текущее фото пользователя в формате PNG. Set-Cookie не выдаётся.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Content-Length:
              description: Размер возвращаемого PNG в байтах.
              schema:
                type: integer
                format: int64
                minimum: 1
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: ID не является положительным целым числом в диапазоне int64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid user ID
        '401':
          description: Cookie отсутствует, токен некорректен либо сессия истекла или отозвана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid or expired session
        '404':
          description: Пользователь не найден, фото не установлено либо его файл отсутствует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value:
                    error: user not found
                photoNotFound:
                  value:
                    error: user photo not found
        '500':
          description: Внутренняя ошибка чтения файла или БД. Технические подробности клиенту не возвращаются.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error
    put:
      summary: Загрузка или замена фото профиля
      description: |
        Устанавливает единственное текущее фото пользователя.
        Требует действующую сессию в cookie chat_session. ID из URL должен
        совпадать с ID пользователя сессии; менять чужое фото запрещено.
        Доступ проверяется до чтения тела запроса.

        Тело содержит байты одного JPEG или PNG, без JSON, Base64 и multipart.
        Размер ограничен обязательной настройкой MAX_PHOTO_SIZE в байтах;
        пример настройки в README задаёт 5242880 (5 MiB). Ровно заданный лимит допускается.
        Формат и размеры проверяются по содержимому изображения:
        ширина и высота должны быть от 1 до 4096 пикселей.

        Изображение обрезается до центрального квадрата и приводится к 256 × 256.
        Результат кодируется в PNG с сохранением прозрачности.
        Оригинал не сохраняется, EXIF-ориентация не учитывается.
        При замене сервер сохраняет новый файл и обновляет ссылку в БД,
        после чего удаляет предыдущий файл. updated_at отражает изменение профиля;
        created_at, username, имя и пароль не меняются.
        Сессия не продлевается и новая cookie не выдаётся.

        Запросы браузера с чужого сайта отклоняются до обработки изображения.
        UI и API должны иметь один origin; CORS не настроен.
        Запросы CLI без Origin и Sec-Fetch-Site допускаются.
      operationId: uploadUserPhoto
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Положительный ID пользователя; разрешена загрузка только собственного фото.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 42
      requestBody:
        required: true
        description: Непустое бинарное тело с изображением; Content-Type соответствует одному из разрешённых типов.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Фото установлено или заменено. Тело ответа отсутствует; Set-Cookie не выдаётся.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          description: Некорректный ID, пустое или непрочитанное тело, повреждённое изображение либо недопустимые размеры.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidID:
                  value:
                    error: invalid user ID
                invalidBody:
                  value:
                    error: invalid request body
                invalidImage:
                  value:
                    error: photo must be a valid JPEG or PNG image
                invalidDimensions:
                  value:
                    error: photo dimensions must be between 1 and 4096 pixels
        '401':
          description: Cookie отсутствует, токен некорректен либо сессия истекла или отозвана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid or expired session
        '403':
          description: Попытка изменить чужое фото либо запрос с чужого сайта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                anotherUser:
                  value:
                    error: access denied
                crossOrigin:
                  value:
                    error: cross-origin request blocked
        '404':
          description: Пользователь с собственным ID не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: user not found
        '413':
          description: Размер тела превышает MAX_PHOTO_SIZE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                requestTooLarge:
                  value:
                    error: request body too large
                photoTooLarge:
                  value:
                    error: photo file is too large
        '415':
          description: Content-Type отсутствует, некорректен или отличается от image/jpeg и image/png.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Content-Type must be image/jpeg or image/png
        '500':
          description: |
            Внутренняя ошибка обработки, хранения или БД. Технические подробности
            клиенту не возвращаются. При ошибке связи с БД результат обновления
            может быть неопределённым: ответ не гарантирует сохранение прежнего фото.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error

    delete:
      summary: Удаление фото профиля
      description: |
        Удаляет текущее фото пользователя. Требует действующую сессию в cookie
        chat_session. ID из URL должен совпадать с ID пользователя сессии;
        удалять чужое фото запрещено. Тело запроса не требуется.
        Сессия проверяется до разбора ID: без действующей сессии возвращается 401.

        Сервер сначала очищает ссылку на фото в БД, затем удаляет файл.
        Ошибка удаления файла записывается в журнал и не отменяет успешное
        изменение профиля: ответ остаётся 204, файл может остаться в хранилище.
        При ошибке обновления БД сервер не приступает к удалению файла.
        При ошибке связи с БД результат обновления может быть неопределённым.

        Удаление установленного фото обновляет updated_at профиля.
        Если фото уже отсутствует, запрос также возвращает 204,
        при этом updated_at не меняется. Отсутствие фото не является ошибкой 404.
        Сессия не продлевается и новая cookie не выдаётся.

        Запросы браузера с чужого сайта отклоняются до изменения профиля.
        UI и API должны иметь один origin; CORS не настроен.
        Запросы CLI без Origin и Sec-Fetch-Site допускаются.
      operationId: deleteUserPhoto
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Положительный ID пользователя; разрешено удаление только собственного фото.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 42
      responses:
        '204':
          description: Фото удалено или уже отсутствует. Тело ответа отсутствует; Set-Cookie не выдаётся.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          description: ID не является положительным целым числом в диапазоне int64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid user ID
        '401':
          description: Cookie отсутствует, токен некорректен либо сессия истекла или отозвана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid or expired session
        '403':
          description: Попытка удалить чужое фото либо запрос с чужого сайта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                anotherUser:
                  value:
                    error: access denied
                crossOrigin:
                  value:
                    error: cross-origin request blocked
        '404':
          description: Пользователь с собственным ID не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: user not found
        '500':
          description: Внутренняя ошибка БД. Технические подробности клиенту не возвращаются.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error

  /conversations/direct:
    post:
      summary: Создание или получение прямого диалога
      operationId: createDirectConversation
      description: |
        Текущий пользователь определяется по cookie chat_session, собеседник —
        по recipient_username. ID инициатора клиент не передаёт.
        Диалог с собой запрещён. Подтверждение собеседника не требуется.
        Новая переписка сразу видна обоим участникам, даже без сообщений.
        Повторный или встречный запрос возвращает тот же диалог с прежней датой.
        И создание, и получение существующего диалога дают 200, а не 201 или 409.
        Сессия проверяется до разбора тела. Межсайтовые запросы браузера запрещены;
        UI и API должны иметь один origin. CLI без Origin и Sec-Fetch-Site допустим.
        Сессия не продлевается, Set-Cookie не выдаётся.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        description: Один JSON-объект не более 4096 байт; неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationDirectRequest'
      responses:
        '200':
          description: Созданный или существующий прямой диалог.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          description: Некорректный JSON, username, неизвестные поля или диалог с собой.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                invalidUsername:
                  value:
                    error: username must contain 3 to 32 lowercase ASCII letters, digits or underscores
                selfDialogue:
                  value:
                    error: direct conversation requires two distinct positive user IDs
        '401':
          $ref: '#/components/responses/ConversationUnauthorized'
        '403':
          description: Запрос с чужого сайта отклонён до создания диалога.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: cross-origin request blocked
        '404':
          description: Собеседник не найден либо существующая переписка не найдена после конфликта пары.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value:
                    error: user not found
                conversationNotFound:
                  value:
                    error: conversation not found
        '413':
          description: Тело запроса превышает 4096 байт.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: request body too large
        '415':
          description: Отсутствует или некорректен Content-Type application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Content-Type must be application/json
        '500':
          $ref: '#/components/responses/ConversationInternalError'

  /conversations/group:
    post:
      summary: Создание групповой переписки
      operationId: createGroupConversation
      description: |
        Создатель определяется по cookie chat_session и автоматически становится
        владельцем и участником группы. В usernames передаются 1–49 других
        участников; всего в группе при создании от 2 до 50 пользователей.
        Все указанные пользователи должны существовать. Повторы после нормализации
        и включение создателя в usernames запрещены. Подтверждение участников
        не требуется. Переписка сразу доступна им через общие endpoints чтения,
        списка, сообщений и истории.

        Каждый успешный запрос создаёт новую группу, даже при совпадении названия
        и состава. Повтор запроса после потери ответа может создать ещё одну группу.
        Переписка, участники и данные группы сохраняются одной транзакцией.
        Сессия проверяется до разбора тела. Межсайтовые запросы браузера запрещены;
        UI и API должны иметь один origin. CLI без Origin и Sec-Fetch-Site допустим.
        Сессия не продлевается, Set-Cookie не выдаётся.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        description: Один JSON-объект не более 16384 байт; неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationGroupRequest'
      responses:
        '201':
          description: Новая группа с названием и владельцем.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationGroupResponse'
        '400':
          description: Некорректное тело, название, username или состав участников.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                invalidName:
                  value:
                    error: group name must contain 1 to 100 Unicode code points, must not be whitespace-only or contain U+0000
                invalidParticipants:
                  value:
                    error: group requires 1 to 49 distinct participants other than its owner
                invalidUsername:
                  value:
                    error: username must contain 3 to 32 lowercase ASCII letters, digits or underscores
        '401':
          $ref: '#/components/responses/ConversationUnauthorized'
        '403':
          description: Запрос с чужого сайта отклонён до создания группы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: cross-origin request blocked
        '404':
          description: Хотя бы один указанный пользователь не найден; группа не создаётся.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: user not found
        '413':
          description: Тело запроса превышает 16384 байта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: request body too large
        '415':
          description: Отсутствует или некорректен Content-Type application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Content-Type must be application/json
        '500':
          $ref: '#/components/responses/ConversationInternalError'

  /conversations/personal:
    post:
      summary: Создание или получение личной переписки («Избранное»)
      operationId: createPersonalConversation
      description: |
        Владелец и единственный участник определяются по cookie chat_session.
        Тело запроса не требуется и игнорируется; Content-Type не обязателен.
        У пользователя не больше одной личной переписки. Повторные и одновременные
        запросы возвращают ту же переписку с прежними ID и датой создания.
        И создание, и получение существующей переписки дают 200.
        Регистрация и GET-запросы личную переписку не создают.
        После создания она доступна через общие маршруты чтения и списка.
        Межсайтовые запросы браузера запрещены; UI и API должны иметь один origin.
        CLI без Origin и Sec-Fetch-Site допустим.
        Сессия не продлевается, Set-Cookie не выдаётся.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Созданная или существующая личная переписка.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
              example:
                id: 3
                type: personal
                created_at: '2026-11-22T12:00:00Z'
        '401':
          $ref: '#/components/responses/ConversationUnauthorized'
        '403':
          description: Запрос с чужого сайта отклонён до создания переписки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: cross-origin request blocked
        '404':
          description: Пользователь либо существующая переписка после конфликта не найдены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value:
                    error: user not found
                conversationNotFound:
                  value:
                    error: conversation not found
        '500':
          $ref: '#/components/responses/ConversationInternalError'

  /conversations/{id}/messages:
    get:
      summary: Чтение истории сообщений
      operationId: listConversationMessages
      description: |
        Возвращает до 50 сообщений переписки по ID в порядке убывания.
        Без before_id возвращается последняя страница; с ним — сообщения с id < before_id.
        Для следующей страницы передайте next_cursor из ответа как before_id.
        Если более старых сообщений нет, next_cursor равен null.
        Пустая история возвращается как messages: [] и next_cursor: null.
        Размер страницы фиксирован; параметр limit не поддерживается.
        Курсор является границей диапазона и не обязан совпадать с существующим сообщением.
        Доступ разрешён только участнику, определённому по cookie chat_session.
        Чужая и отсутствующая переписки дают одинаковый 404.
        Сессия проверяется до разбора ID и параметров запроса.
        Чтение не создаёт сообщения, не продлевает сессию и не выдаёт Set-Cookie.
        Страницы читаются отдельными запросами и не являются снимком всей истории.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
        - name: before_id
          in: query
          required: false
          description: Исключительная верхняя граница ID. Пустое значение и повторение параметра запрещены.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 150
      responses:
        '200':
          description: Страница истории прямого диалога или личной переписки.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagePageResponse'
              examples:
                lastPage:
                  value:
                    messages:
                      - id: 149
                        conversation_id: 7
                        sender_user_id: 42
                        text: Привет!
                        created_at: '2026-11-23T12:00:00.123456Z'
                    next_cursor: null
                empty:
                  value:
                    messages: []
                    next_cursor: null
        '400':
          description: Некорректный ID, курсор или кодирование query-параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidID:
                  value:
                    error: invalid conversation ID
                invalidCursor:
                  value:
                    error: message cursor must be a positive integer
        '401':
          $ref: '#/components/responses/ConversationUnauthorized'
        '404':
          description: Переписка отсутствует либо пользователь не является её участником.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: conversation not found
        '500':
          $ref: '#/components/responses/ConversationInternalError'
    post:
      summary: Отправка текстового сообщения
      operationId: createConversationMessage
      description: |
        Сохраняет сообщение в прямом диалоге или личной переписке текущего пользователя.
        Отправитель определяется только по cookie chat_session, переписка — по ID пути.
        Чужая и отсутствующая переписки дают одинаковый 404.
        Сессия проверяется до разбора ID и тела. Правила текста проверяются до
        транзакции; участие проверяется внутри неё после блокировки переписки.
        Пробелы и переносы строк сохраняются без изменений.
        Ответ 201 означает сохранение в БД, но не доставку или прочтение собеседником.
        Каждый успешный запрос создаёт новое сообщение, даже с тем же текстом.
        Защита от дублей при повторе после потери ответа пока не реализована.
        Межсайтовые запросы браузера запрещены; UI и API должны иметь один origin.
        CLI без Origin и Sec-Fetch-Site допустим.
        Сессия не продлевается, Set-Cookie не выдаётся.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
      requestBody:
        required: true
        description: Один JSON-объект в корректном UTF-8, не более 65536 байт; неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessageRequest'
      responses:
        '201':
          description: Сохранённое сообщение с ID и датой из БД.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessageResponse'
        '400':
          description: Некорректный ID, JSON, UTF-8, неизвестное поле или недопустимый текст.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidID:
                  value:
                    error: invalid conversation ID
                invalidBody:
                  value:
                    error: invalid request body
                invalidText:
                  value:
                    error: message text must contain 1 to 4000 Unicode code points, must not be whitespace-only or contain U+0000
        '401':
          $ref: '#/components/responses/ConversationUnauthorized'
        '403':
          description: Запрос с чужого сайта отклонён до отправки сообщения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: cross-origin request blocked
        '404':
          description: Переписка отсутствует либо пользователь не является её участником.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: conversation not found
        '413':
          description: Тело запроса превышает 65536 байт.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: request body too large
        '415':
          description: Отсутствует или некорректен Content-Type application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Content-Type must be application/json
        '500':
          $ref: '#/components/responses/ConversationInternalError'

  /conversations/{id}:
    get:
      summary: Получение переписки участником
      operationId: getConversationByID
      description: |
        Возвращает переписку только её участнику, определённому по сессии.
        Посторонний и запрос отсутствующей переписки получают одинаковый 404.
        Сессия проверяется до разбора ID. Чтение не меняет дату переписки,
        не продлевает сессию и не выдаёт Set-Cookie.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
      responses:
        '200':
          description: Переписка текущего пользователя.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          description: ID не является положительным целым числом в диапазоне int64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid conversation ID
        '401':
          $ref: '#/components/responses/ConversationUnauthorized'
        '404':
          description: Переписка отсутствует либо пользователь не является её участником.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: conversation not found
        '500':
          $ref: '#/components/responses/ConversationInternalError'

  /conversations:
    get:
      summary: Список собственных переписок
      operationId: listUserConversations
      description: |
        Возвращает все переписки текущего пользователя, определённого по сессии.
        Пагинации нет. Порядок — created_at DESC, затем id DESC.
        Пустой список возвращается как [], а не null. Чужие переписки не включаются.
        Параметры query и заголовки не позволяют выбрать другого пользователя.
        Чтение не продлевает сессию и не выдаёт Set-Cookie.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Полный список переписок, включая пустой.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationResponse'
        '401':
          $ref: '#/components/responses/ConversationUnauthorized'
        '500':
          $ref: '#/components/responses/ConversationInternalError'

components:
  responses:
    ConversationUnauthorized:
      description: Cookie отсутствует, токен некорректен либо сессия истекла или отозвана.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid or expired session
    ConversationInternalError:
      description: Внутренняя ошибка. Технические подробности клиенту не возвращаются.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal server error
    AuthRateLimitExceeded:
      description: |
        Достигнут лимит запросов для IP либо заполнена таблица отслеживаемых IP.
        Запрос отклонён до проверки данных и создания пользователя или сессии;
        Set-Cookie отсутствует. Retry-After задаёт время ожидания перед повтором.
        Счётчики хранятся отдельно в каждом процессе и сбрасываются при перезапуске.
        Запросы, отклонённые защитой от чужого origin, не расходуют лимит.
        IP определяется по соединению; X-Forwarded-For и X-Real-IP не учитываются.
      headers:
        Retry-After:
          description: Число секунд до повторной попытки, округлённое вверх.
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
          example: '60'
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: too many requests
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: chat_session
      description: |
        Сессионная cookie устанавливается сервером при регистрации или входе.
        Сессия действует 7 дней без продления по активности.
  schemas:
    ConversationMessagePageResponse:
      type: object
      additionalProperties: false
      required:
        - messages
        - next_cursor
      properties:
        messages:
          type: array
          maxItems: 50
          description: Сообщения по ID в порядке убывания; пустой результат — массив [], не null.
          items:
            $ref: '#/components/schemas/ConversationMessageResponse'
        next_cursor:
          type: [integer, 'null']
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID последнего сообщения страницы, если есть более старые; иначе null. Передаётся в before_id следующего запроса.
          example: 100
    ConversationMessageRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            Обычный текст, не состоящий целиком из пробельных символов и без U+0000.
            Лимит считается в Unicode-кодовых точках (rune), включая пробелы
            и переносы строк. Текст не обрезается и не нормализуется.
          example: "Привет!\nКак дела?"
    ConversationMessageResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - conversation_id
        - sender_user_id
        - text
        - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 9
        conversation_id:
          type: integer
          format: int64
          minimum: 1
          example: 7
        sender_user_id:
          type: integer
          format: int64
          minimum: 1
          example: 42
        text:
          type: string
          example: "Привет!\nКак дела?"
        created_at:
          type: string
          format: date-time
          description: Дата создания сообщения в UTC, с точностью хранения PostgreSQL.
          example: '2026-11-23T12:00:00.123456Z'
    ConversationDirectRequest:
      type: object
      additionalProperties: false
      required:
        - recipient_username
      properties:
        recipient_username:
          type: string
          minLength: 3
          description: |
            Точный username собеседника. Внешние пробелы удаляются, буквы
            приводятся к нижнему регистру. После нормализации допустимы
            3–32 символа a–z, 0–9 и _. Отображаемое имя name не используется.
          example: ' Anna '
    ConversationGroupRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - usernames
      properties:
        name:
          type: string
          minLength: 1
          description: |
            Внешние пробелы удаляются. После обрезки — от 1 до 100 Unicode-кодовых
            точек без U+0000. Регистр и внутренние пробелы сохраняются.
            Название не обязано быть уникальным.
          example: ' Семья '
        usernames:
          type: array
          minItems: 1
          maxItems: 49
          uniqueItems: true
          description: |
            Точные usernames других участников. Каждый нормализуется обрезкой
            внешних пробелов и приведением к нижнему регистру. Повторы проверяются
            после нормализации. Username владельца передавать нельзя.
          items:
            type: string
            minLength: 3
            description: После нормализации — 3–32 символа a–z, 0–9 и _.
          example: [anna, oleg]
    ConversationGroupResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - created_at
        - owner_user_id
        - name
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 7
        type:
          type: string
          const: group
        created_at:
          type: string
          format: date-time
          description: Дата создания группы в UTC.
          example: '2026-11-24T12:00:00Z'
        owner_user_id:
          type: integer
          format: int64
          minimum: 1
          example: 42
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Семья
    ConversationResponse:
      type: object
      description: Общие поля переписки. Чтение по ID и список пока не возвращают название и владельца группы.
      additionalProperties: false
      required:
        - id
        - type
        - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 7
        type:
          type: string
          enum: [direct, personal, group]
        created_at:
          type: string
          format: date-time
          description: Дата создания переписки в UTC; повторное получение direct или personal не меняет дату. Повторное создание group создаёт новую переписку.
          example: '2026-11-21T12:00:00Z'
    UserRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - name
        - password
      properties:
        username:
          type: string
          minLength: 3
          description: |
            Внешние пробелы удаляются, буквы приводятся к нижнему регистру.
            После нормализации допускаются 3–32 символа a–z, 0–9 и _.
          example: Ivan
        name:
          type: string
          minLength: 1
          description: |
            Внешние пробелы удаляются. После нормализации — 1–80 Unicode-кодовых
            точек без управляющих символов и переносов строк. Регистр и пробелы
            внутри имени сохраняются; совпадения с чужими именами допустимы.
          example: Иван Петров
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          maxLength: 128
          description: |
            От 15 до 128 Unicode-кодовых точек. Пробелы разрешены;
            обрезка пробелов, смена регистра и нормализация не выполняются.
            Обязательных классов символов нет.
    UserLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          description: |
            Внешние пробелы удаляются, буквы приводятся к нижнему регистру.
            После нормализации допускаются 3–32 символа a–z, 0–9 и _.
            Неверное значение приводит к ответу 401.
          example: Ivan
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 128
          description: |
            Пароль существующего пользователя, от 1 до 128 Unicode-кодовых точек.
            Передаётся без обрезки пробелов, смены регистра и нормализации.
            Минимальная длина нового пароля при регистрации здесь не применяется.
            Пустой, слишком длинный или несовпадающий пароль приводит к ответу 401.
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 42
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-z0-9_]{3,32}$'
          example: ivan
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Иван Петров
        created_at:
          type: string
          format: date-time
          description: Время создания пользователя в UTC.
          example: '2026-11-16T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: При регистрации равно created_at.
          example: '2026-11-16T12:00:00Z'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          minLength: 1

